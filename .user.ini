; Interim mitigations for PHP2Shell (CVE-2026-109618, CVE-2026-109619).
; The complete fix is running PHP 8.2.35, 8.3.36, 8.4.27, 8.5.12 or later.
; Remove these overrides once the host is on a patched release.

; CVE-2026-109618: avoid the out-of-memory cleanup path.
memory_limit = -1

; CVE-2026-109619: disable the upload-progress state reused across requests.
session.upload_progress.enabled = 0

; CVE-2026-109619 on PHP 8.5 (ignored by older versions).
fatal_error_backtraces = 0
