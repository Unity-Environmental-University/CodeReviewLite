name: Deploy PHP site to Bluehost (index.php only, preserve /data)

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Create a minimal deploy dir with only index.php
      - name: Prepare deploy folder
        run: |
          mkdir -p _deploy
          cp -f index.php _deploy/index.php

      - name: Upload via FTP (only index.php; keep /data safe)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}   # e.g. /public_html/
          local-dir: ./_deploy/                        # contains only index.php
          dangerous-clean-slate: true                  # delete *except excluded* paths
          exclude: |
            data
            data/**
