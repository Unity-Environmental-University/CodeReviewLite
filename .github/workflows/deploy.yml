name: Deploy PHP site to Bluehost (index.php only, preserve /data)

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload via FTP (only index.php; exclude /data from upload & delete)
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}   
          local-dir: ./                               
          # Clean remote to match repo, BUT do not touch excluded paths
          dangerous-clean-slate: true
          exclude: |
            data/**
            .git/**
            .github/**
            .ftp-deploy-sync-state.json
            node_modules/**
            vendor/**
            .env
            .env.*
