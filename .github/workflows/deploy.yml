name: Deploy PHP site to Bluehost (index.php only)

on:
  push:
    branches: [ "main" ]

# Prevent overlapping deploys
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload via FTP (only index.php due to ignore rules)
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}   # e.g. /public_html/
          local-dir: ./                                # upload from repo root
          dangerous-clean-slate: true                  # remove files not in "allowed" set
